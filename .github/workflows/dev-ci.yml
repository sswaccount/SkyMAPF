name: Dev CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Core, protocol, and runner tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install public SDK dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSKYMAPF_BUILD_PYTHON_BINDINGS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Run CLI smoke tests
        run: |
          ./build/bin/skymapf --version
          ./build/bin/skymapf --help

      - name: Run example smoke tests
        run: |
          ./build/bin/examples/example_1_helloworld__main
          ./build/bin/examples/example_2_CreateScenario__main

  python-sdk:
    name: Python SDK and wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test pure-Python SDK
        run: PYTHONPATH=python python -m unittest discover -s python/tests -v

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Test installed wheel and native extension
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import skymapf; assert skymapf.HAS_CORE; print(skymapf.__version__)"
