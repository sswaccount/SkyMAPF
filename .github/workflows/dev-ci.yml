name: Dev CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test C++
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSKYMAPF_BUILD_PYTHON_BINDINGS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Run CLI smoke tests
        run: |
          ./build/bin/skymapf --version
          ./build/bin/skymapf --help

      - name: Run example smoke tests
        run: |
          ./build/bin/examples/example_1_helloworld__main
          ./build/bin/examples/example_2_CreateScenario__main
